<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terraform Intermediate Quiz — Review Mode</title>
<style>
  :root {
    --bg: #f6f5f2;
    --bg-panel: #ffffff;
    --bg-inset: #efeee9;
    --text: #201f1c;
    --text-dim: #6b6a64;
    --border: #ddd9d0;
    --accent: #5c4ee5;
    --accent-text: #ffffff;
    --correct: #1f7a4d;
    --correct-bg: #e3f3e8;
    --incorrect: #b3401f;
    --incorrect-bg: #fbe9e2;
    --unanswered: #c9c5b9;
    --mono: 'SF Mono', 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16151a;
      --bg-panel: #1f1e24;
      --bg-inset: #26252c;
      --text: #ece9e2;
      --text-dim: #9b988f;
      --border: #35333c;
      --accent: #9d8dff;
      --accent-text: #16151a;
      --correct: #6fd39a;
      --correct-bg: #1c3327;
      --incorrect: #ff9075;
      --incorrect-bg: #3a2018;
      --unanswered: #45434c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16151a; --bg-panel: #1f1e24; --bg-inset: #26252c; --text: #ece9e2; --text-dim: #9b988f;
    --border: #35333c; --accent: #9d8dff; --accent-text: #16151a; --correct: #6fd39a; --correct-bg: #1c3327;
    --incorrect: #ff9075; --incorrect-bg: #3a2018; --unanswered: #45434c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.5; padding: 20px 16px 60px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .subtitle { color: var(--text-dim); font-size: 0.9rem; margin: 0; }
  .part-tabs { display: flex; gap: 6px; margin-top: 14px; }
  .part-tab { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-panel); color: var(--text); cursor: pointer; font-size: 0.85rem; font-family: var(--sans); text-align: center; }
  .part-tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .score-bar { display: flex; align-items: center; gap: 14px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-top: 14px; font-size: 0.85rem; flex-wrap: wrap; }
  .score-bar .stat { display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.correct { background: var(--correct); }
  .dot.incorrect { background: var(--incorrect); }
  .dot.unanswered { background: var(--unanswered); }
  .score-bar .fill-spacer { flex: 1; }
  .filter-btn { border: 1px solid var(--border); background: var(--bg-inset); color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; font-family: var(--sans); }
  .filter-btn.active { background: var(--incorrect); color: white; border-color: var(--incorrect); }
  .reset-btn { border: 1px solid var(--border); background: transparent; color: var(--text-dim); padding: 6px 12px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; font-family: var(--sans); }
  .view-results-btn { border: 1px solid var(--correct); background: var(--correct-bg); color: var(--correct); padding: 6px 12px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; font-family: var(--sans); }
  .grid-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 14px; }
  .grid-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; }
  .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 6px; }
  .qbtn { aspect-ratio: 1; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-inset); color: var(--text-dim); font-family: var(--mono); font-size: 0.72rem; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .qbtn.correct { background: var(--correct-bg); color: var(--correct); border-color: var(--correct); }
  .qbtn.incorrect { background: var(--incorrect-bg); color: var(--incorrect); border-color: var(--incorrect); }
  .qbtn.current { outline: 2px solid var(--accent); outline-offset: 2px; }
  .qgrid.filtered .qbtn.dimmed { opacity: 0.25; pointer-events: none; }
  .qcard { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-top: 16px; }
  .qmeta { font-family: var(--mono); font-size: 0.78rem; color: var(--text-dim); margin-bottom: 8px; }
  .qtext { font-size: 1.08rem; font-weight: 600; margin: 0 0 18px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option { text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-inset); color: var(--text); cursor: pointer; font-family: var(--sans); font-size: 0.92rem; display: flex; gap: 10px; align-items: flex-start; }
  .option .letter { font-family: var(--mono); font-size: 0.78rem; color: var(--text-dim); border: 1px solid var(--border); border-radius: 5px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .option.picked-correct { background: var(--correct-bg); border-color: var(--correct); }
  .option.picked-correct .letter { border-color: var(--correct); color: var(--correct); }
  .option.picked-incorrect { background: var(--incorrect-bg); border-color: var(--incorrect); }
  .option.picked-incorrect .letter { border-color: var(--incorrect); color: var(--incorrect); }
  .option.reveal-correct { border-color: var(--correct); }
  .option:disabled { cursor: default; }
  .feedback { margin-top: 16px; padding: 14px; border-radius: 10px; font-size: 0.88rem; }
  .feedback.correct { background: var(--correct-bg); color: var(--correct); }
  .feedback.incorrect { background: var(--incorrect-bg); color: var(--incorrect); }
  .feedback .explain { color: var(--text); margin-top: 6px; opacity: 0.9; }
  .explain h3 { font-size: 0.9rem; margin: 16px 0 6px; }
  .explain p { margin: 6px 0; }
  .answer-analysis { list-style: none; padding: 0; margin: 8px 0; }
  .answer-analysis li { margin: 12px 0; }
  .explain a { color: var(--accent); text-decoration: underline; overflow-wrap: anywhere; }
  .explain a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .nav-row { display: flex; justify-content: space-between; margin-top: 18px; gap: 10px; }
  .nav-btn { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-inset); color: var(--text); cursor: pointer; font-size: 0.88rem; font-family: var(--sans); }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  .nav-btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .nav-btn.submit { background: var(--correct); color: white; border-color: var(--correct); font-weight: 600; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }
  .empty-state .big { font-size: 2rem; margin-bottom: 8px; }
  footer { text-align: center; margin-top: 24px; color: var(--text-dim); font-size: 0.78rem; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .results-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px; max-width: 440px; width: 100%; text-align: center; }
  .results-card .score-big { font-size: 2.6rem; font-weight: 700; margin: 6px 0 2px; }
  .results-card .score-label { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 18px; }
  .results-breakdown { display: flex; justify-content: center; gap: 18px; margin-bottom: 22px; font-size: 0.85rem; }
  .results-breakdown .stat { display: flex; align-items: center; gap: 6px; }
  .results-actions { display: flex; flex-direction: column; gap: 8px; }
  .results-actions .nav-btn { width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Terraform Intermediate Quiz — Review Mode</h1>
    <p class="subtitle">60 questions, intermediate level. Answer a question to see an in-depth explanation, an option-by-option review, a practical tip, and official documentation.</p>
    <div class="part-tabs">
      <button class="part-tab active" id="tab1" onclick="switchPart(1)">Part 1 · Q1–30</button>
      <button class="part-tab" id="tab2" onclick="switchPart(2)">Part 2 · Q31–60</button>
    </div>
  </header>
  <div class="score-bar" id="scoreBar"></div>
  <div class="grid-panel">
    <div class="grid-label" id="gridLabel">All questions — click to jump</div>
    <div class="qgrid" id="qgrid"></div>
  </div>
  <div id="qcardHolder"></div>
  <footer>Progress is saved in this browser automatically.</footer>
</div>

<script>
const DATA = {
  1: [
    {
      q:"Two resources reference each other via attributes, creating a dependency Terraform can't resolve. What happens?", o:["Terraform reports a dependency cycle error and refuses to plan","Terraform picks one arbitrarily and applies it first","Terraform silently ignores the second reference","Terraform creates both resources in parallel regardless"], a:0,
      e:"Terraform builds a directed dependency graph from references and explicit dependencies. A cycle means there is no valid ordering in which all prerequisites can be satisfied, so Terraform reports the cycle rather than producing a usable plan.",
      r:["Correct: graph validation detects circular dependencies before operations can be scheduled.", "Arbitrary ordering would violate at least one resource's prerequisite; Terraform does not guess.", "Ignoring a reference would change the configuration's meaning and potentially use an unavailable value.", "Parallelism only helps independent nodes; it cannot resolve mutually dependent prerequisites."],
      tip:"For mutually referencing security groups, consider separate rule resources so both groups can exist before rules reference their IDs. Adding more depends_on relationships does not break a cycle.",
      doc:"Terraform dependency graph: validating the graph", url:"https://developer.hashicorp.com/terraform/internals/graph"
    },
    {
      q:"How do you safely ignore drift on a specific attribute (e.g., an ECS service's desired_count) changed outside Terraform?", o:["Remove the attribute from state manually","Add a lifecycle block with ignore_changes = [attribute]","Use terraform refresh -target","Mark the attribute as sensitive"], a:1,
      e:"The lifecycle ignore_changes rule excludes selected attributes from update comparisons, while still considering their configured values when creating a resource. It supports shared ownership when an external controller legitimately changes an attribute.",
      r:["Editing state is not an ongoing ownership policy; refresh can read the attribute again, and manual edits can corrupt state.", "Correct: a static attribute path such as ignore_changes = [desired_count] tells Terraform not to reconcile that field during updates.", "Refreshing observes remote values; it does not prevent later plans from comparing them with configuration.", "Sensitive controls display redaction, not drift detection or resource updates."],
      tip:"Use this when an autoscaler owns ECS desired_count, not to silence unexplained changes. Terraform will also ignore unwanted drift on that field, so keep the ignored attribute list narrow.",
      doc:"Lifecycle reference: ignore_changes", url:"https://developer.hashicorp.com/terraform/language/meta-arguments/lifecycle#ignore_changes"
    },
    {
      q:"What's the difference between local-exec and remote-exec regarding connection blocks?", o:["local-exec requires a connection block; remote-exec does not", "Both always require a connection block", "remote-exec requires a connection block (SSH/WinRM) to reach the resource; local-exec does not", "Neither ever needs a connection block"], a:2,
      e:"local-exec starts a command on the Terraform runner, which may be your laptop or a CI worker. remote-exec connects to a remote host using SSH or WinRM; connection settings can be supplied at the resource or provisioner level.",
      r:["This reverses the behavior: it is the remote provisioner that needs connection settings.", "A local process does not need Terraform's remote connection block.", "Correct: remote-exec needs transport, host, and authentication information; local-exec runs locally.", "remote-exec cannot execute on a host without a supported, reachable connection."],
      tip:"A local-exec command does not run inside the newly created VM. Prefer cloud-init or image-based bootstrapping where possible; remote provisioning also depends on network access and host readiness.",
      doc:"Provisioner connections: SSH and WinRM", url:"https://developer.hashicorp.com/terraform/language/provisioners#connect-to-remote-resources"
    },
    {
      q:"In a for_each loop over a map, what does each.key represent?", o:["The numeric index of the iteration", "The resource's unique cloud ID", "The full map itself", "The map key for the current iteration"], a:3,
      e:"Resource for_each creates one instance per map entry. each.key is the entry's string key and becomes part of the Terraform address, while each.value is the value associated with that key.",
      r:["Numeric indexes belong to count.index; map-based instance identity uses keys.", "The key is chosen by configuration, not assigned by the cloud provider.", "The original map is the entire collection; each describes only the current instance.", "Correct: a key such as prod identifies an address like aws_instance.web[\"prod\"]."],
      tip:"Choose stable semantic keys such as environment names. Keys must be known and non-sensitive during planning; changing a key changes the instance address even if each.value remains the same.",
      doc:"for_each reference: the each object", url:"https://developer.hashicorp.com/terraform/language/meta-arguments/for_each#referring-to-instances"
    },
    {
      q:"What's the risk of switching an existing resource from count to for_each (or vice versa)?", o:["Terraform may plan a destroy and recreate, since resource addresses (index vs key) change", "Nothing changes; Terraform automatically migrates the addresses", "Only the state file needs to be deleted, no plan changes", "Terraform blocks the switch entirely with an error"], a:0,
      e:"Terraform associates remote objects with resource addresses in state. An instance at web[0] and one at web[\"prod\"] have different identities unless you explicitly describe how the old address maps to the new one.",
      r:["Correct: without address migration, Terraform can interpret the old instance as removed and the new instance as needing creation.", "Terraform cannot generally infer which arbitrary string key corresponds to each numeric index.", "Deleting state discards ownership records and can lead to duplicate creation or conflicts.", "The refactor is supported; it simply requires careful state/address migration."],
      tip:"Add moved blocks mapping each old index to its new key, or use a coordinated terraform state mv. Back up state and inspect the plan; unrelated attribute changes can still cause replacements.",
      doc:"Refactoring: moving between count and for_each", url:"https://developer.hashicorp.com/terraform/language/modules/develop/refactoring"
    },
    {
      q:"What does a 'moved' block (Terraform 1.1+) do?", o:["It physically moves resources between cloud regions", "It tells Terraform a resource's address changed, so it updates state instead of destroying/recreating it", "It moves a module's source location automatically", "It merges two separate state files together"], a:1,
      e:"A moved block records an old and new Terraform address. Terraform interprets the existing object's binding at the new address, allowing a resource or module refactor without replacement caused solely by the address change.",
      r:["Cloud relocation is a provider operation and may itself require replacement; moved changes Terraform addressing.", "Correct: the from/to mapping preserves the managed object's identity during a refactor.", "A module's source controls where its code is downloaded from; moved does not relocate that source code.", "Moved blocks operate on addresses within a configuration's state, not arbitrary state-file merging."],
      tip:"Use moved blocks when renaming a resource label or extracting resources into a module. Retain historical moves so consumers can upgrade from older versions; still review any provider-argument changes separately.",
      doc:"Refactor modules with moved blocks", url:"https://developer.hashicorp.com/terraform/language/modules/develop/refactoring"
    },
    {
      q:"What is the purpose of a precondition/postcondition block (custom conditions, Terraform 1.2+)?", o:["To automatically fix invalid configuration values", "To document code without affecting execution", "To validate assumptions or guarantees at plan/apply time, failing early with a custom error message", "To enforce billing limits on a resource"], a:2,
      e:"Preconditions validate assumptions before the associated operation; postconditions validate the resulting resource or data-source values. Conditions evaluate when their inputs are known, which can be during planning or deferred until apply.",
      r:["Conditions report violations; they do not rewrite invalid inputs.", "These are executable assertions that can block an operation or dependent operations, not just comments.", "Correct: a failed assertion produces the supplied error message and stops the affected workflow.", "A condition can check an available budget-related value, but it does not impose a cloud billing cap."],
      tip:"Check an image's architecture before creating a VM, or a resulting resource property afterward. A failed postcondition does not roll back infrastructure already created; use non-blocking check assertions for advisory health checks.",
      doc:"Custom conditions: preconditions and postconditions", url:"https://developer.hashicorp.com/terraform/language/validate#preconditions-and-postconditions"
    },
    {
      q:"Which construct lets you fetch outputs from another Terraform state file/backend?", o:["terraform_output resource", "remote_state provider", "state_import block", "terraform_remote_state data source"], a:3,
      e:"The built-in terraform_remote_state data source reads the latest state snapshot from a configured backend and exposes its root outputs. It allows separately managed stacks to exchange values without sharing a single lifecycle.",
      r:["There is no built-in terraform_output resource; output blocks publish values instead.", "The construct is a data source from the built-in Terraform provider, not a provider named remote_state.", "A state_import block is not Terraform syntax; import blocks adopt cloud resources rather than read outputs.", "Correct: its outputs attribute exposes values exported at the other configuration's root."],
      tip:"A consumer generally needs access to the full state snapshot, even though only outputs are exposed in expressions. Prefer a dedicated outputs service or parameter store when full-state access would reveal secrets.",
      doc:"terraform_remote_state data source and security", url:"https://developer.hashicorp.com/terraform/language/state/remote-state-data"
    },
    {
      q:"What does a splat expression like aws_instance.web[*].id return?", o:["A list of the given attribute across all instances", "Only the first instance's attribute", "A map keyed by instance ID", "A single concatenated string of all values"], a:0,
      e:"A full splat applies an attribute access to each element of a sequence and produces a tuple, commonly consumed as a list-like collection. For a count-based resource, web[*].id collects every instance ID.",
      r:["Correct in the question's list-like sense: the result contains one id per sequence element.", "Selecting only the first element would require an index such as web[0].id.", "A keyed result requires an object/map-producing for expression; a splat does not invent keys.", "Combining IDs into text requires a separate function such as join."],
      tip:"Resources using for_each are maps, not sequences. Use a for expression to preserve keys, or values(aws_instance.web)[*].id if keys are unnecessary. Prefer modern [*] syntax over legacy .* splats.",
      doc:"Splat expressions and for_each limitations", url:"https://developer.hashicorp.com/terraform/language/expressions/splat"
    },
    {
      q:"Which function provides a fallback value if an expression might error (e.g., a missing map key)?", o:["fallback()", "try()", "coalesce_error()", "safe()"], a:1,
      e:"try evaluates candidate expressions and returns the first that succeeds without a dynamic evaluation error. For example, try(local.settings.region, \"us-east-1\") can normalize data whose region attribute might be absent.",
      r:["fallback is not a built-in Terraform function.", "Correct: try handles dynamic errors such as missing attributes and returns a successful alternative.", "coalesce_error is not a built-in function; coalesce handles null/empty values, not evaluation errors.", "safe is not a built-in Terraform function; can tests whether an expression evaluates successfully."],
      tip:"Keep try in normalization locals rather than masking mistakes throughout a module. It cannot catch statically invalid references such as an undeclared variable, and a successful null result does not trigger a fallback.",
      doc:"try function: dynamic errors and normalization", url:"https://developer.hashicorp.com/terraform/language/functions/try"
    },
    {
      q:"What is the purpose of templatefile()?", o:["Downloads a file template from the Terraform Registry", "Creates a new .tf file from a template automatically", "Renders a template file, substituting given variables into it", "Validates a file against a JSON schema"], a:2,
      e:"templatefile(path, vars) reads a UTF-8 file and evaluates its Terraform template expressions using the provided variables object. The result is a string that can be passed to another argument, such as a VM's user-data script.",
      r:["It reads an existing local file; it is not a Registry downloader.", "It returns text and does not write a file or create Terraform configuration on disk.", "Correct: interpolations and template directives render using the supplied variables.", "Rendering is not JSON schema validation; syntax and schema checks require separate mechanisms."],
      tip:"Use templatefile(\"${path.module}/cloud-init.tftpl\", {...}) for portable module paths. The file must exist when the run starts; for JSON/YAML templates prefer jsonencode/yamlencode to hand-built escaping.",
      doc:"templatefile function", url:"https://developer.hashicorp.com/terraform/language/functions/templatefile"
    },
    {
      q:"What is a null_resource typically used for?", o:["To explicitly represent infrastructure Terraform should ignore", "To reserve a resource name for future use", "To delete null values from state", "As a placeholder to trigger provisioners or logic not tied to a real infrastructure resource"], a:3,
      e:"The null provider's null_resource has a Terraform lifecycle without representing a cloud object. Its triggers map can force replacement when values change, making it a traditional host for provisioners or orchestration steps.",
      r:["Ignored attributes are controlled by lifecycle.ignore_changes, not by null_resource.", "It does not reserve a cloud name or prevent another resource from using that name.", "It does not remove null values or clean other resources' state.", "Correct: it supplies an address and lifecycle for an action with no directly managed cloud object."],
      tip:"Provisioners are a last resort and external side effects are not automatically tracked or rolled back. For new Terraform 1.4+ configurations, consider built-in terraform_data instead of adding the null provider.",
      doc:"Null provider: null_resource and triggers", url:"https://registry.terraform.io/providers/hashicorp/null/latest/docs/resources/resource"
    },
    {
      q:"What is terraform_data (introduced in Terraform 1.4)?", o:["A built-in resource that replaces many null_resource use cases with more explicit intent", "A resource used only for storing null values in state", "A deprecated alias for null_resource", "A resource exclusive to Terraform Cloud"], a:0,
      e:"terraform_data is supplied by the built-in terraform.io/builtin/terraform provider. It stores input/output values and offers triggers_replace to cause replacement, supporting lifecycle-driven workflows without downloading a separate provider.",
      r:["Correct: it covers many lifecycle/provisioner patterns previously implemented with null_resource.", "It can hold ordinary Terraform values, not only null, and can drive replacement actions.", "It is a distinct built-in resource, not a deprecated spelling of the null provider's resource.", "It works with the Terraform CLI and supported backends, not only hosted execution."],
      tip:"Use input to retain a value and triggers_replace when a change must rerun a lifecycle action. Changing input alone normally updates the helper rather than rerunning a creation-time provisioner.",
      doc:"terraform_data resource reference", url:"https://developer.hashicorp.com/terraform/language/resources/terraform-data"
    },
    {
      q:"What does the 'import' block (Terraform 1.5+) let you do?", o:["Importing entire modules from the public registry", "Declaratively importing existing resources into state as part of a plan/apply, instead of the CLI import command", "Importing variable values from a .tfvars file", "Importing state from a different backend automatically"], a:1,
      e:"An import block declares the destination resource address and an existing remote object's import identity. Terraform can preview adoption in a plan and record it in state during apply, making imports reviewable in version control.",
      r:["Registry modules are installed through module source declarations and terraform init.", "Correct: the existing object becomes managed at the configured address through the normal workflow.", "Variable files supply inputs through automatic loading or -var-file; they do not adopt resources.", "Moving state between backends uses initialization with migration options, not resource import."],
      tip:"Match the resource configuration to the existing object's settings and review proposed updates before applying. Importing an Azure resource group does not import its contents, and one object should not be owned by multiple states.",
      doc:"Import existing resources with import blocks", url:"https://developer.hashicorp.com/terraform/language/import"
    },
    {
      q:"What do 'check' blocks (Terraform 1.5+) allow you to do?", o:["Validate syntax before terraform init", "Check for available provider updates", "Lock state during a run", "Run non-blocking assertions about infrastructure health during plan/apply, without failing the whole run"], a:3,
      e:"A check block contains assertions about configuration or infrastructure behavior. Terraform evaluates them during plan/apply when values are available; a failed check assertion reports a warning instead of blocking the operation.",
      r:["Syntax/configuration validation belongs to commands such as terraform validate, not health assertions.", "Dependency version selection belongs to required_providers and terraform init -upgrade.", "Locking is implemented by the backend and is unrelated to check blocks.", "Correct: check assertions provide advisory validation, unlike blocking preconditions or postconditions."],
      tip:"Use checks to report endpoint health or other operational assumptions. If a violation must stop deployment, use an appropriate blocking condition or policy rather than relying on a check warning.",
      doc:"Custom conditions: non-blocking checks", url:"https://developer.hashicorp.com/terraform/language/validate#checks"
    },
    {
      q:"What does the 'nullable' argument on a variable block control?", o:["Marks the variable as required with no default", "Hides the variable's value from output", "Restricts the variable to numeric types only", "Allows the variable to explicitly accept a null value"], a:3,
      e:"nullable controls whether the variable's top-level value may be null and defaults to true. With nullable = false, a supplied null uses a non-null default if one exists; otherwise Terraform requires a non-null value.",

let currentPart = 1;
let currentIndex = 0;
let showOnlyIncorrect = false;
let showResults = false;
let answers = { 1: {}, 2: {} };
let submitted = { 1: false, 2: false };

function loadState() {
  try {
    const saved = localStorage.getItem('tf_intermediate_quiz_state_v1');
    if (saved) {
      const parsed = JSON.parse(saved);
      answers = parsed.answers || { 1: {}, 2: {} };
      submitted = parsed.submitted || { 1: false, 2: false };
    }
  } catch (e) {}
}
function saveState() {
  try { localStorage.setItem('tf_intermediate_quiz_state_v1', JSON.stringify({ answers, submitted })); } catch (e) {}
}

function switchPart(part) {
  currentPart = part; currentIndex = 0; showOnlyIncorrect = false; showResults = false;
  document.getElementById('tab1').classList.toggle('active', part === 1);
  document.getElementById('tab2').classList.toggle('active', part === 2);
  render();
}

function statusOf(part, idx) {
  const rec = answers[part][idx];
  if (!rec) return 'unanswered';
  return rec.correct ? 'correct' : 'incorrect';
}

function renderScoreBar() {
  const list = DATA[currentPart];
  let correct = 0, incorrect = 0, unanswered = 0;
  list.forEach((_, i) => {
    const s = statusOf(currentPart, i);
    if (s === 'correct') correct++; else if (s === 'incorrect') incorrect++; else unanswered++;
  });
  const bar = document.getElementById('scoreBar');
  bar.innerHTML = `
    <div class="stat"><span class="dot correct"></span>${correct} correct</div>
    <div class="stat"><span class="dot incorrect"></span>${incorrect} incorrect</div>
    <div class="stat"><span class="dot unanswered"></span>${unanswered} unanswered</div>
    <div class="fill-spacer"></div>
    ${submitted[currentPart] ? `<button class="view-results-btn" onclick="openResults()">View results</button>` : ''}
    <button class="filter-btn ${showOnlyIncorrect ? 'active' : ''}" onclick="toggleFilter()">${showOnlyIncorrect ? 'Showing incorrect only' : 'Show only incorrect'}</button>
    <button class="reset-btn" onclick="resetPart()">Reset part</button>
  `;
}

function toggleFilter() {
  showOnlyIncorrect = !showOnlyIncorrect;
  if (showOnlyIncorrect) {
    const list = DATA[currentPart];
    const firstWrong = list.findIndex((_, i) => statusOf(currentPart, i) === 'incorrect');
    if (firstWrong !== -1) currentIndex = firstWrong;
  }
  render();
}

function resetPart() {
  if (!confirm('Reset all answers for this part?')) return;
  answers[currentPart] = {}; submitted[currentPart] = false; showResults = false;
  saveState(); currentIndex = 0; render();
}

function renderGrid() {
  const list = DATA[currentPart];
  const grid = document.getElementById('qgrid');
  const label = document.getElementById('gridLabel');
  label.textContent = showOnlyIncorrect ? 'Incorrect questions — click to jump' : 'All questions — click to jump';
  grid.className = 'qgrid' + (showOnlyIncorrect ? ' filtered' : '');
  grid.innerHTML = '';
  list.forEach((_, i) => {
    const status = statusOf(currentPart, i);
    const btn = document.createElement('button');
    btn.className = 'qbtn ' + status + (i === currentIndex ? ' current' : '') + (showOnlyIncorrect && status !== 'incorrect' ? ' dimmed' : '');
    btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; render(); };
    grid.appendChild(btn);
  });
}

function pickAnswer(idx) {
  const q = DATA[currentPart][currentIndex];
  const correct = idx === q.a;
  answers[currentPart][currentIndex] = { picked: idx, correct };
  saveState(); render();
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[character]));
}

function renderQCard() {
  const holder = document.getElementById('qcardHolder');
  const list = DATA[currentPart];

  if (showOnlyIncorrect) {
    const wrongIndices = list.map((_, i) => i).filter(i => statusOf(currentPart, i) === 'incorrect');
    if (wrongIndices.length === 0) {
      holder.innerHTML = `<div class="qcard"><div class="empty-state"><div class="big">🎉</div>All questions in this part are correct (or unanswered). Nothing to review.</div></div>`;
      return;
    }
    if (!wrongIndices.includes(currentIndex)) currentIndex = wrongIndices[0];
  }

  const q = list[currentIndex];
  const rec = answers[currentPart][currentIndex];
  const letters = ['A', 'B', 'C', 'D'];
  const isLastQuestion = currentIndex === list.length - 1;

  let optionsHtml = q.o.map((opt, i) => {
    let cls = 'option';
    if (rec) {
      if (i === rec.picked && rec.correct) cls += ' picked-correct';
      else if (i === rec.picked && !rec.correct) cls += ' picked-incorrect';
      else if (i === q.a) cls += ' reveal-correct';
    }
    return `<button class="${cls}" ${rec ? 'disabled' : ''} onclick="pickAnswer(${i})">
      <span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>
    </button>`;
  }).join('');

  let feedbackHtml = '';
  if (rec) {
    feedbackHtml = `<div class="feedback ${rec.correct ? 'correct' : 'incorrect'}">
      ${rec.correct ? '✓ Correct' : '✗ Incorrect — correct answer: ' + escapeHtml(q.o[q.a])}
      <div class="explain">
        <h3>Underlying concept</h3>
        <p>${escapeHtml(q.e)}</p>
        <h3>Why each option is correct or incorrect</h3>
        <ul class="answer-analysis">
          ${q.r.map((reason, i) => `<li><strong>${letters[i]}. ${escapeHtml(q.o[i])}</strong><p>${escapeHtml(reason)}</p></li>`).join('')}
        </ul>
        <h3>Real-world use and pitfalls</h3>
        <p>${escapeHtml(q.tip)}</p>
        <h3>Official documentation</h3>
        <a href="${escapeHtml(q.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(q.doc)} (opens in a new tab)</a>
      </div>
    </div>`;
  }

  holder.innerHTML = `
    <div class="qcard">
      <div class="qmeta">Question ${currentIndex + 1} of ${list.length} — Part ${currentPart}</div>
      <p class="qtext">${escapeHtml(q.q)}</p>
      <div class="options">${optionsHtml}</div>
      ${feedbackHtml}
      <div class="nav-row">
        <button class="nav-btn" onclick="prevQ()" ${currentIndex === 0 ? 'disabled' : ''}>← Back</button>
        ${isLastQuestion
          ? `<button class="nav-btn submit" onclick="submitQuiz()">Submit ✓</button>`
          : `<button class="nav-btn primary" onclick="nextQ()">Next →</button>`
        }
      </div>
    </div>
  `;
}

function submitQuiz() { submitted[currentPart] = true; showResults = true; saveState(); render(); }
function openResults() { showResults = true; render(); }
function closeResults() { showResults = false; render(); }
function reviewIncorrectFromResults() {
  showResults = false; showOnlyIncorrect = true;
  const list = DATA[currentPart];
  const firstWrong = list.map((_, i) => i).findIndex(i => statusOf(currentPart, i) === 'incorrect');
  if (firstWrong !== -1) currentIndex = firstWrong;
  render();
}

function renderResultsOverlay() {
  const existing = document.getElementById('resultsOverlay');
  if (existing) existing.remove();
  if (!showResults) return;
  const list = DATA[currentPart];
  let correct = 0, incorrect = 0, unanswered = 0;
  list.forEach((_, i) => {
    const s = statusOf(currentPart, i);
    if (s === 'correct') correct++; else if (s === 'incorrect') incorrect++; else unanswered++;
  });
  const pct = Math.round((correct / list.length) * 100);
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'resultsOverlay';
  overlay.innerHTML = `
    <div class="results-card">
      <div class="score-label">Part ${currentPart} results</div>
      <div class="score-big">${pct}%</div>
      <div class="score-label">${correct} of ${list.length} correct</div>
      <div class="results-breakdown">
        <div class="stat"><span class="dot correct"></span>${correct} correct</div>
        <div class="stat"><span class="dot incorrect"></span>${incorrect} incorrect</div>
        ${unanswered > 0 ? `<div class="stat"><span class="dot unanswered"></span>${unanswered} unanswered</div>` : ''}
      </div>
      <div class="results-actions">
        ${incorrect > 0 ? `<button class="nav-btn submit" onclick="reviewIncorrectFromResults()">Review ${incorrect} incorrect answer${incorrect > 1 ? 's' : ''}</button>` : ''}
        <button class="nav-btn" onclick="closeResults()">Close</button>
      </div>
    </div>
  `;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeResults(); });
  document.body.appendChild(overlay);
}

function prevQ() {
  if (showOnlyIncorrect) {
    const list = DATA[currentPart];
    const wrongIndices = list.map((_, i) => i).filter(i => statusOf(currentPart, i) === 'incorrect');
    const pos = wrongIndices.indexOf(currentIndex);
    if (pos > 0) currentIndex = wrongIndices[pos - 1];
  } else if (currentIndex > 0) { currentIndex--; }
  render();
}
function nextQ() {
  if (showOnlyIncorrect) {
    const list = DATA[currentPart];
    const wrongIndices = list.map((_, i) => i).filter(i => statusOf(currentPart, i) === 'incorrect');
    const pos = wrongIndices.indexOf(currentIndex);
    if (pos < wrongIndices.length - 1) currentIndex = wrongIndices[pos + 1];
  } else if (currentIndex < DATA[currentPart].length - 1) { currentIndex++; }
  render();
}

function render() { renderScoreBar(); renderGrid(); renderQCard(); renderResultsOverlay(); }

loadState();
render();
</script>
</body>
